[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-anticodes"
version = "0.1.0"
description = "Finite-field symplectic spaces from the Quantum Anticodes paper"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["galois>=0.4.6,<0.5"]

[tool.setuptools.packages.find]
where = ["src"]
